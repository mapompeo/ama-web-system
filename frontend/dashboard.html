<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>!function(){var t=localStorage.getItem('ama-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}()</script>
  <title>Dashboard — AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div id="loading" style="display:flex;justify-content:center;align-items:center;height:60vh">
      <div class="spinner-border text-success" role="status"></div>
    </div>
    <div id="content" style="display:none">
      <div class="page-header">
        <div>
          <h1 class="page-title">Dashboard</h1>
          <p class="text-muted mb-0" style="font-size:.82rem">Visão geral da AMA ONG</p>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card"><div class="stat-icon green"><i class="bi bi-people-fill"></i></div>
            <div><div class="stat-value" id="stat-volunteers">—</div><div class="stat-label">Voluntários ativos</div></div></div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card"><div class="stat-icon blue"><i class="bi bi-person-heart"></i></div>
            <div><div class="stat-value" id="stat-beneficiaries">—</div><div class="stat-label">Atendidos ativos</div></div></div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card"><div class="stat-icon amber"><i class="bi bi-calendar-check"></i></div>
            <div><div class="stat-value" id="stat-upcoming">—</div><div class="stat-label">Atividades agendadas</div></div></div>
        </div>
        <div class="col-sm-6 col-xl-3">
          <div class="stat-card"><div class="stat-icon purple"><i class="bi bi-bar-chart-fill"></i></div>
            <div><div class="stat-value" id="stat-total">—</div><div class="stat-label">Atividades em <span id="chart-year"></span></div></div></div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card h-100">
            <div class="card-header d-flex align-items-center justify-content-between">
              <span><i class="bi bi-bar-chart me-2 text-success"></i>Atividades por mês</span>
              <span class="badge bg-success bg-opacity-10 text-success fw-semibold" id="chart-year-badge"></span>
            </div>
            <div class="card-body"><canvas id="activityChart" height="130"></canvas></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card h-100">
            <div class="card-header"><i class="bi bi-clock-history me-2 text-primary"></i>Atividades Recentes</div>
            <div class="card-body p-0"><ul class="list-group list-group-flush" id="recent-list"></ul></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/pages/dashboard.js"></script>
</body>
</html>
