<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>!function(){var t=localStorage.getItem('ama-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}()</script>
  <title>Login — AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body {
      background: var(--body-bg);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1rem;
    }

    .login-wrap { width: 100%; max-width: 400px; }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .login-header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 2rem 2rem 1.5rem;
      text-align: center;
    }

    .login-brand-icon {
      display: inline-flex; width: 56px; height: 56px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border-radius: 16px; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #fff;
      box-shadow: 0 8px 24px rgba(22,163,74,.4);
      margin-bottom: .85rem;
    }

    .login-brand-title { font-family: Inter, sans-serif; font-weight: 700; color: var(--text-heading); font-size: 1.35rem; letter-spacing: -.02em; margin: 0; }
    .login-brand-sub   { color: var(--text-muted); font-size: .78rem; margin: .2rem 0 0; }

    .login-body { padding: 1.75rem 2rem 2rem; }

    .login-title { font-family: Inter, sans-serif; font-weight: 600; color: var(--text-heading); font-size: 1rem; margin: 0 0 .2rem; }
    .login-sub   { color: var(--text-muted); font-size: .8rem; margin: 0 0 1.4rem; }

    .login-footer-text { text-align: center; margin-top: 1.25rem; color: var(--text-subtle); font-size: .75rem; }

    /* Toggle de tema */
    .theme-btn-float {
      position: fixed; top: 1rem; right: 1rem;
      width: 38px; height: 38px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 1rem;
      cursor: pointer; transition: background .15s, color .15s, box-shadow .15s;
      box-shadow: var(--shadow-sm);
    }
    .theme-btn-float:hover { color: var(--text-heading); box-shadow: var(--shadow-md); }
  </style>
</head>
<body>

  <!-- Toggle de tema -->
  <button id="themeToggle" class="theme-btn-float" title="Alternar tema">
    <i id="themeIcon" class="bi bi-moon"></i>
  </button>

  <div class="login-wrap">
    <!-- Card de login -->
    <div class="login-card">
      <!-- Header do brand (segue o tema) -->
      <div class="login-header">
        <div class="login-brand-icon"><i class="bi bi-heart-fill"></i></div>
        <h1 class="login-brand-title">AMA ONG</h1>
        <p class="login-brand-sub">Associação Palmira Gobbi Amigo dos Amigos</p>
      </div>

      <!-- Corpo do form (segue o tema) -->
      <div class="login-body">
        <h2 class="login-title">Entrar na sua conta</h2>
        <p class="login-sub">Digite suas credenciais para acessar o sistema</p>
        <div id="alert-container"></div>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" placeholder="seu@email.com" required autofocus />
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" placeholder="••••••••" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
          </button>
        </form>
      </div>
    </div>

    <p class="login-footer-text">Sistema de Gestão — AMA ONG &copy; 2026</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Redireciona se já autenticado
    fetch('/api/auth/me', { credentials: 'include' }).then(r => { if (r.ok) window.location.href = '/dashboard'; });

    // ── Tema ──────────────────────────────────────────────────────
    function applyTheme(theme) {
      document.documentElement.classList.add('theme-transitioning');
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('ama-theme', theme);
      const icon = document.getElementById('themeIcon');
      if (icon) icon.className = theme === 'dark' ? 'bi bi-sun' : 'bi bi-moon';
      setTimeout(() => document.documentElement.classList.remove('theme-transitioning'), 300);
    }

    // Sincroniza ícone ao carregar
    (function () {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.getElementById('themeIcon').className = isDark ? 'bi bi-sun' : 'bi bi-moon';
    })();

    document.getElementById('themeToggle').addEventListener('click', () => {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // ── Login ─────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('[type=submit]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Entrando...';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao entrar');
        window.location.href = '/dashboard';
      } catch (err) {
        const c = document.getElementById('alert-container');
        c.innerHTML = `<div class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-circle me-2"></i>${err.message}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Entrar';
      }
    });
  </script>
</body>
</html>
