<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body style="background:linear-gradient(135deg,#0f172a 0%,#1e3a2f 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem">
  <div style="width:100%;max-width:400px">
    <div class="text-center mb-4">
      <div style="display:inline-flex;width:60px;height:60px;background:linear-gradient(135deg,#16a34a,#22c55e);border-radius:18px;align-items:center;justify-content:center;font-size:1.6rem;color:#fff;box-shadow:0 8px 24px rgba(22,163,74,.4);margin-bottom:1rem">
        <i class="bi bi-heart-fill"></i>
      </div>
      <h2 style="font-family:Inter,sans-serif;font-weight:700;color:#f8fafc;font-size:1.4rem;letter-spacing:-.02em;margin:0">AMA ONG</h2>
      <p style="color:#64748b;font-size:.8rem;margin:.25rem 0 0">Associação Palmira Gobbi Amigo dos Amigos</p>
    </div>
    <div style="background:#fff;border-radius:18px;padding:2rem;box-shadow:0 24px 60px rgba(0,0,0,.3)">
      <h3 style="font-family:Inter,sans-serif;font-weight:600;color:#0f172a;font-size:1.1rem;margin:0 0 .25rem">Entrar na sua conta</h3>
      <p style="color:#64748b;font-size:.8rem;margin:0 0 1.5rem">Digite suas credenciais para acessar o sistema</p>
      <div id="alert-container"></div>
      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="seu@email.com" required autofocus />
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Senha</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
      </form>
    </div>
    <p class="text-center mt-3" style="color:#334155;font-size:.75rem">Sistema de Gestão — AMA ONG &copy; 2026</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Redireciona se já autenticado
    fetch('/api/auth/me', { credentials: 'include' }).then(r => { if (r.ok) window.location.href = '/dashboard'; });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = e.target.querySelector('[type=submit]');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Entrando...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao entrar');
        window.location.href = '/dashboard';
      } catch (err) {
        const c = document.getElementById('alert-container');
        c.innerHTML = `<div class="alert alert-danger alert-dismissible fade show"><i class="bi bi-exclamation-circle me-2"></i>${err.message}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Entrar';
      }
    });
  </script>
</body>
</html>
