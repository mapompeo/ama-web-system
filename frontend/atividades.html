<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>!function(){var t=localStorage.getItem('ama-theme')||'light';document.documentElement.setAttribute('data-theme',t)}()</script>
  <title>Atividades | AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon-round.svg" />
  <link rel="alternate icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="layout-table">
    <div id="loading" style="display:flex;justify-content:center;align-items:center;height:60vh">
      <div class="spinner-border text-success" role="status"></div>
    </div>
    <div id="content" style="display:none">
      <nav aria-label="breadcrumb" class="mb-1"><ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item active">Atividades</li>
      </ol></nav>
      <div class="page-header">
        <h1 class="page-title">Atividades</h1>
        <a href="/atividades-form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Nova</a>
      </div>
      <div id="alert-container"></div>
      <div class="card table-card">
        <div class="card-header">
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <div class="input-group input-group-sm" style="max-width:280px">
              <span class="input-group-text"><i class="bi bi-search"></i></span>
              <input type="text" id="tableSearch" class="form-control" placeholder="Buscar atividade..." />
            </div>

            <div class="dropdown">
              <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="btnStatus"
                data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">Status</button>
              <ul class="dropdown-menu shadow-sm" style="min-width:160px">
                <li><label class="dropdown-item d-flex align-items-center gap-2 py-2">
                  <input type="checkbox" class="form-check-input filter-status" value="agendada">
                  <span class="badge bg-warning text-dark">Agendada</span>
                </label></li>
                <li><label class="dropdown-item d-flex align-items-center gap-2 py-2">
                  <input type="checkbox" class="form-check-input filter-status" value="realizada">
                  <span class="badge bg-success">Realizada</span>
                </label></li>
                <li><label class="dropdown-item d-flex align-items-center gap-2 py-2">
                  <input type="checkbox" class="form-check-input filter-status" value="cancelada">
                  <span class="badge bg-danger">Cancelada</span>
                </label></li>
              </ul>
            </div>

            <button id="clearFilters" class="btn btn-sm btn-link text-danger p-0" style="display:none;font-size:.8rem">
              <i class="bi bi-x-circle me-1"></i>Limpar filtros
            </button>

            <div class="ms-auto d-flex align-items-center gap-2">
              <span class="text-muted" id="record-count" style="font-size:.78rem"></span>
              <button id="exportBtn" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-download me-1"></i>Exportar
              </button>
            </div>
          </div>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr><th>#</th><th>Título</th><th>Data</th><th>Local</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="card-footer"><div id="tablePagination"></div></div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="delModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirmar exclusão</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Remover <strong id="del-name"></strong>? Esta ação não pode ser desfeita.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="del-confirm" data-bs-dismiss="modal"><i class="bi bi-trash me-1"></i>Remover</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/atividades.js"></script>
</body>
</html>
