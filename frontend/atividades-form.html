<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>!function(){var t=localStorage.getItem('ama-theme')||'light';document.documentElement.setAttribute('data-theme',t)}()</script>
  <title>Atividade | AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon-round.svg" />
  <link rel="alternate icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div id="loading" style="display:flex;justify-content:center;align-items:center;height:60vh">
      <div class="spinner-border text-success" role="status"></div>
    </div>
    <div id="content" style="display:none">
      <nav aria-label="breadcrumb" class="mb-1"><ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="/atividades">Atividades</a></li>
        <li class="breadcrumb-item active" id="crumb-action">Nova Atividade</li>
      </ol></nav>
      <div class="page-header"><h1 class="page-title" id="page-title">Nova Atividade</h1></div>
      <div id="alert-container"></div>
      <div class="card" style="max-width:700px">
        <div class="card-body p-4">
          <form id="main-form" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label">Título *</label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                  <input type="text" class="form-control" id="f-title" placeholder="Ex: Distribuição de Cestas Básicas" minlength="3" required />
                  <div class="invalid-feedback">Informe o título.</div>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" id="f-desc" rows="3" placeholder="Descreva os detalhes da atividade..."></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label">Data *</label>
                <input type="date" class="form-control" id="f-date" required />
                <div class="invalid-feedback">Informe uma data válida.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Local</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                  <input type="text" class="form-control" id="f-location" placeholder="Ex: Sede da AMA, Salão Comunitário..." />
                  <a id="maps-btn" href="#" target="_blank" rel="noopener" class="btn btn-outline-secondary" title="Abrir no Google Maps" style="display:none"><i class="bi bi-map"></i></a>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select" id="f-status">
                  <option value="agendada">Agendada</option>
                  <option value="realizada">Realizada</option>
                  <option value="cancelada">Cancelada</option>
                </select>
              </div>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
              <a href="/atividades" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/atividades-form.js"></script>
</body>
</html>
