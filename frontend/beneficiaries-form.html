<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atendido — AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div id="loading" style="display:flex;justify-content:center;align-items:center;height:60vh">
      <div class="spinner-border text-success" role="status"></div>
    </div>
    <div id="content" style="display:none">
      <nav aria-label="breadcrumb" class="mb-3"><ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="/beneficiaries">Atendidos</a></li>
        <li class="breadcrumb-item active" id="crumb-action">Novo Atendido</li>
      </ol></nav>
      <div class="page-header"><h1 class="page-title" id="page-title">Novo Atendido</h1></div>
      <div id="alert-container"></div>
      <div class="card" style="max-width:700px">
        <div class="card-body p-4">
          <form id="main-form" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome completo *</label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="f-name" placeholder="Ex: João da Silva" minlength="3" required />
                  <div class="invalid-feedback">Informe o nome completo.</div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">CPF</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                  <input type="text" class="form-control" id="f-cpf" data-mask="cpf" />
                  <div class="invalid-feedback">CPF inválido.</div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Data de nascimento</label>
                <input type="date" class="form-control" id="f-birth-date" min="1900-01-01" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Telefone</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="text" class="form-control" id="f-phone" data-mask="phone" />
                  <div class="invalid-feedback">Telefone inválido.</div>
                </div>
              </div>
              <div class="col-12">
                <label class="form-label">Endereço</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                  <input type="text" class="form-control" id="f-address" placeholder="Rua, número, bairro, cidade" />
                  <a id="maps-btn" href="#" target="_blank" rel="noopener" class="btn btn-outline-secondary" title="Abrir no Google Maps" style="display:none"><i class="bi bi-map"></i></a>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Nome do responsável</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-check"></i></span>
                  <input type="text" class="form-control" id="f-responsible" placeholder="Nome do responsável legal" />
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select" id="f-status">
                  <option value="ativo">Ativo</option>
                  <option value="inativo">Inativo</option>
                </select>
              </div>
            </div>
            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
              <a href="/beneficiaries" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>document.getElementById('f-birth-date').max = new Date().toISOString().split('T')[0];</script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/beneficiaries-form.js"></script>
</body>
</html>
