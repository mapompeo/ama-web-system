<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voluntários — AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="layout-table">
    <div id="loading" style="display:flex;justify-content:center;align-items:center;height:60vh">
      <div class="spinner-border text-success" role="status"></div>
    </div>
    <div id="content" style="display:none">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div>
          <nav aria-label="breadcrumb"><ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
            <li class="breadcrumb-item active">Voluntários</li>
          </ol></nav>
          <h1 class="page-title mt-1">Voluntários</h1>
        </div>
        <a href="/volunteers-form" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Novo</a>
      </div>
      <div id="alert-container"></div>
      <div class="card table-card">
        <div class="card-header d-flex align-items-center justify-content-between">
          <div class="input-group input-group-sm" style="max-width:280px">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="tableSearch" class="form-control" placeholder="Buscar voluntário..." />
          </div>
          <span class="text-muted" id="record-count" style="font-size:.78rem"></span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr><th>#</th><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Endereço</th><th>Entrada</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
        <div class="card-footer"><div id="tablePagination"></div></div>
      </div>
    </div>
  </main>

  <!-- Modal exclusão (único, reutilizável) -->
  <div class="modal fade" id="delModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirmar exclusão</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Remover <strong id="del-name"></strong>? Esta ação não pode ser desfeita.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="del-confirm" data-bs-dismiss="modal"><i class="bi bi-trash me-1"></i>Remover</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/volunteers.js"></script>
</body>
</html>
