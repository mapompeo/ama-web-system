<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>!function(){var t=localStorage.getItem('ama-theme')||'light';document.documentElement.setAttribute('data-theme',t)}()</script>
  <title>Animal | AMA ONG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon-round.svg" />
  <link rel="alternate icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main>
    <div id="loading" style="display:flex;justify-content:center;align-items:center;height:60vh">
      <div class="spinner-border text-success" role="status"></div>
    </div>
    <div id="content" style="display:none">
      <nav aria-label="breadcrumb" class="mb-1"><ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="/dashboard">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="/animais">Animais</a></li>
        <li class="breadcrumb-item active" id="crumb-action">Novo Animal</li>
      </ol></nav>
      <div class="page-header"><h1 class="page-title" id="page-title">Novo Animal</h1></div>
      <div id="alert-container"></div>
      <div class="card" style="max-width:760px">
        <div class="card-body p-4">
          <form id="main-form" novalidate>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome do animal *</label>
                <div class="input-group has-validation">
                  <span class="input-group-text"><i class="bi bi-hearts"></i></span>
                  <input type="text" class="form-control" id="f-name" placeholder="Ex: Rex, Mel, Bolinha" minlength="2" required />
                  <div class="invalid-feedback">Informe o nome do animal.</div>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Espécie *</label>
                <select class="form-select" id="f-species" required>
                  <option value="Cachorro">Cachorro</option>
                  <option value="Gato">Gato</option>
                  <option value="Outro">Outro</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mt-0">
              <div class="col-md-5">
                <label class="form-label">Raça</label>
                <input type="text" class="form-control" id="f-breed" placeholder="Ex: Vira-lata, Labrador, Persa" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Sexo</label>
                <select class="form-select" id="f-sex">
                  <option value="Não identificado">Não identificado</option>
                  <option value="Macho">Macho</option>
                  <option value="Fêmea">Fêmea</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Porte</label>
                <select class="form-select" id="f-size">
                  <option value="">— selecione —</option>
                  <option value="Pequeno">Pequeno</option>
                  <option value="Médio">Médio</option>
                  <option value="Grande">Grande</option>
                  <option value="Gigante">Gigante</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mt-0">
              <div class="col-md-6">
                <label class="form-label">Data de nascimento <span class="text-muted" style="font-size:.8rem">(aproximada)</span></label>
                <input type="date" class="form-control" id="f-birth-date" min="2000-01-01" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Status *</label>
                <select class="form-select" id="f-status" required>
                  <option value="disponivel">Disponível para adoção</option>
                  <option value="adotado">Adotado</option>
                  <option value="em_tratamento">Em tratamento</option>
                  <option value="obito">Óbito</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mt-0">
              <div class="col-md-6">
                <label class="form-label">Nome do responsável / tutor</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-person-check"></i></span>
                  <input type="text" class="form-control" id="f-responsible" placeholder="Quem entregou ou cuida do animal" />
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Telefone do responsável</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                  <input type="text" class="form-control" id="f-responsible-phone" data-mask="phone" />
                </div>
              </div>
            </div>

            <div class="row g-3 mt-0">
              <div class="col-12">
                <label class="form-label">Observações <span class="text-muted" style="font-size:.8rem">(saúde, vacinas, comportamento…)</span></label>
                <textarea class="form-control" id="f-notes" rows="3"
                  placeholder="Ex: Vacinado e castrado. Encontrado na Rua das Flores. Sociável com crianças."></textarea>
              </div>
            </div>

            <hr class="my-4" />

            <div id="contract-section" style="display:none">
              <h6 class="fw-semibold mb-2"><i class="bi bi-file-earmark-pdf me-2 text-danger"></i>Contratos de Adoção</h6>
              <p class="text-muted" style="font-size:.82rem">Anexe os contratos de adoção preenchidos e assinados.</p>
              <div id="contract-empty">
                <p class="text-muted mb-1" style="font-size:.82rem"><i class="bi bi-info-circle me-1"></i>Nenhum contrato anexado.</p>
              </div>
              <div id="contract-list" class="d-flex flex-column gap-2 mb-3"></div>
              <input type="file" class="form-control form-control-sm" id="f-contract" accept=".pdf" style="max-width:320px" />
              <div class="form-text mb-0">Apenas PDF.</div>
            </div>

            <div class="mt-4 d-flex gap-2">
              <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
              <a href="/animais" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="delContractModal" tabindex="-1">
    <div class="modal-dialog modal-sm modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Confirmar exclusão</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Remover <strong></strong>? Esta ação não pode ser desfeita.</div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-danger" id="delContractConfirm" data-bs-dismiss="modal"><i class="bi bi-trash me-1"></i>Remover</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="pdfModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title"><i class="bi bi-file-earmark-pdf text-danger me-2"></i><span id="pdf-modal-title">Contrato de Adoção</span></h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0" style="height:85vh">
          <iframe id="pdf-frame" src="" style="width:100%;height:100%;border:none" title="Visualizador PDF"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('f-birth-date').max = new Date().toISOString().split('T')[0];
  </script>
  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/pages/animais-form.js"></script>
</body>
</html>
